## 1. 一页速览

**Fascinator 是什么**：一个"认知架构"研究原型。它不是聊天机器人框架，而是一次实验——把**语义记忆、情景记忆、程序性记忆、情绪、自我、行为倾向**全部塞进**同一张知识图谱**里，然后用**激活扩散**（spreading activation）这一个机制去驱动所有认知行为：注意力聚焦、记忆召回、情绪反应、要不要说话、说什么。

**一句话概括信息流**：

```
用户说一句话 → LLM 把它拆成图上的节点和边 → 这些节点被"点亮"
→ 激活沿边扩散、衰减、竞争 → 活得最好的若干节点成为"当前在想的事"（Top-K）
→ 如果"LLM回答"这个节点被顶过阈值，就把 Top-K 交给 LLM 说成人话
```

**规模**（截至本快照）：

| 指标 | 数值 |
|---|---|
| Python 代码总量 | 40,557 行（含测试/脚本/原型） |
| 核心运行时代码 | 27,854 行（`app.py` 6035 行为单文件最大头） |
| 当前运行图谱 | **651 节点 / 1084 边** |
| Flask API 端点 | 145 个 |
| 测试套件 | 72 个脚本式文件（71 个离线回归 + 1 个活体冒烟），2026-09-22 收尾全套件 72/72 |
| 前端 | `index.html` 2305 行，12 个标签页 |

**技术栈**：Python 3.10+ / Flask / FAISS / sentence-transformers(BGE-small-zh) / LLM 走小米 MiMo（默认）或 DeepSeek API，Ollama 本地后端存在但默认关闭 / Mineflayer(Node.js) 做 Minecraft 具身。

**能干什么**（真实能力，非愿景）：

- 多轮对话，且回答基于图检索而非纯 LLM 幻觉（Top-K 可追溯）
- 遇到不认识的词会**主动反问**（好奇心机制），用户回答后自动沉淀进图
- 记住经历类事实，带时间锚点、父子事件层级
- 有情绪节点、有偏好（边权）、有自我模型、有行为倾向
- 空闲时**自主行动**：在 Minecraft 里观察/靠近/跟随/采集/撤离（零 LLM，纯确定性）
- 认知调节：可以给任意对象加锁、定义状态检测器、定义触发器
- 视觉（截屏 OCR / 对象检测）、听觉（语音/音乐/环境声分类）两条感知通道
- 多通道：不只在网页聊天，游戏聊天框里说话也走同一条认知管线

## 2. 设计哲学：三条信条

这三条不是口号，代码里到处都是它们留下的痕迹（注释、守卫、测试）。

### 信条一：万物皆图（Everything is Graph）

> `self_graph.py:5` — "禁止新增 PersonalityManager / EmotionManager / PreferenceManager / GoalManager / IdentityManager / ReflectionManager / ExperienceManager 或任何独立保存状态的 Python 对象。所有认知状态必须由：节点 + 边 + 边权 + 激活度共同决定。"

含义：**不要存储结果，而是存储关系**。比如"她喜欢 Minecraft"不是某个布尔字段，而是 `Self -[喜欢 w=0.72]-> Minecraft` 这条边；"她现在心情不好"不是某个 mood 变量，而是 `难过` 节点的激活值高。

后果：
- 倾向会自然衰减：disposition 节点强度按 `DECAY_FACTOR=0.97` 逐反思周期衰减（`decay_all` 挂 reflection 节拍）；`Self-[喜欢]->X` 偏好边本身**没有**独立的时间衰减参数（2026-09-22 收尾核实：旧文档所写 `preference_decay_per_day` 是从未被读取的死键，已删）
- 情绪会参与扩散（情绪词是图节点，`type=emotion`）
- 任何一次认知活动都**可观测、可追溯、可解释**

**例外清单**（这些刻意不入图，见 `docs/fas_cognitive_architecture_v2.md` §五）：自然语言句子本身、每轮回答的原始文本（进 `chat_log`）、扩散中间量、向量索引、阈值比较器本身。

### 信条二：注意力由激活竞争产生，不是代码 if-else 决定

旧式做法是"如果用户问天气 → 走天气分支"。Fascinator 的做法是：把"回答""追问""沉默""搜索"都做成图上的**行为节点**，让它们互相竞争，谁的激活高谁执行；都没顶过阈值就**真的沉默**。

这条信条在代码里的硬约束（`docs/fas_cognitive_architecture_v2.md` §六）：固定规则只允许出现在三个地方——
1. **输入校验**（白名单、JSON 格式）
2. **物理守恒**（能量钳制、fire-once、队列顺序）
3. **发育期脚手架**（明确标注可降级的临时兜底）

### 信条三：可解释性优先于性能

代价体现在代码里：大量 `logger.info` 记录决策依据（每轮都打印"回答区节点: X(2.31), Y(1.87)..."）、`explain` 字段随候选一起返回前端、`cycle_id` 贯穿所有内部状态写入。这是有意的——她为什么这么回答，必须能查。

### 3.2 关键设计决策表

| 决策 | 做法 | 代价 / 收益 |
|---|---|---|
| 单进程单图 | 一个 Python 进程持有一张图，`threading.RLock` 保护 | 简单、可直接调试；无法水平扩展 |
| 单文件后端 | 全部路由写在 `app.py`（5972 行） | 找东西靠 grep；但避免了循环依赖 |
| LLM 是"增强器"不是"中枢" | LLM 挂了/超预算 → 图谱继续跑，降级为不回答 | 韧性好；但降级时回答质量骤降 |
| 意图层与具身层解耦 | `autonomy.py` 只产生语义意图，具身适配器执行 | 换环境只换适配器；需要写适配器接口 |
| 持久化用 JSON | 图谱、状态、日志全是 JSON 文件 | 可读、可 diff、可用 git 管；大图会慢 |

## 4. 数据模型：统一知识图谱

代码位置：`graph_model.py`（616 行）

### 4.1 Node —— 节点

| 字段 | 类型 | 默认 | 含义 |
|---|---|---|---|
| `id` | str | 必填 | 节点标识（**就是节点名本身**，中文名直接当 ID） |
| `weight` | float | 0.0 | **静态**先验重要性，裁剪到 `[-2.0, 2.0]` |
| `activation` | float | 0.0 | **运行时**动态激活值（≥0，受空间 cap 限制） |
| `label` | enum | declarative-semantic | 记忆类型，见下表 |
| `graph_space` | enum | semantic | 认知空间，决定生命周期与传播参数 |
| `execution` | str\|None | None | 程序性节点的 Python 代码字符串 |
| `confidence` | float | 0.5 | 知识置信度 `[0,1]` |
| `extra_attrs` | dict | {} | 自由属性（`type`、`aliases`、`self_capability`…） |
| `created` / `last_access` | str | now | 时间戳 `YYYY/MM/DD HH:MM:SS` |

**weight 与 activation 的分离**是关键设计：`weight` 是"这条知识有多重要"（长期、缓慢变化），`activation` 是"此刻它有多活跃"（瞬时、每轮清零重来）。服务器重启时 **所有 activation 归零**（`app.py:249-258`），因为"激活是瞬时认知状态，不应随图谱结构持久化"。

#### label —— 记忆类型（5 种）

| label | 含义 | 当前数量 |
|---|---|---|
| `declarative-semantic` | 语义记忆：客观事实/概念 | 515 |
| `declarative-episodic` | 情景记忆：个人经历/事件 | 83 |
| `infrastructure` | 基础设施：引擎零件，不参与认知输出 | 29 |
| `procedural` | 程序性记忆：可执行动作 | 23 |
| `self` | 自我节点（只有 1 个：`Self`） | 1 |

#### graph_space —— 认知空间（4 种）

这是 2026-09 引入的"架构重评估 0.1"改造。**空间不限制连接**（跨空间联想是核心能力），只决定**生命周期和传播动力学**：

| 空间 | 语义 | λ 衰减 | β 增益 | 允许双向 | 激活上限 | 当前数量 |
|---|---|---|---|---|---|---|
| `semantic` | 客观知识 | 0.05 | 1.0 | ✅ | 5.0 | 470 |
| `episodic` | 经历/事件 | **0.15**（快忘） | 0.7 | ❌ | 3.0 | 57 |
| `cognitive` | 认知过程 | 0.08 | **1.5** | ❌ | 5.0 | 37 |
| `self` | 自我相关 | **0.01**（慢变） | 0.5 | ✅ | 5.0 | 87 |

读法：情景记忆忘得快（λ=0.15）、自我认知极稳定（λ=0.01）、认知过程起得快（β=1.5）。

### 4.2 Edge —— 边

| 字段 | 类型 | 默认 | 含义 |
|---|---|---|---|
| `src` / `dst` | str | 必填 | 起点 / 终点节点 ID |
| `relation` | str | 必填 | 关系名（自由文本，如 `喜欢`、`导致`、`时间顺序`） |
| `weight` | float | 0.5 | 边权，同样裁剪到 `[-2, 2]` |
| `activation` | float | 0.0 | 运行时边激活（被频繁使用的边传信号更强） |
| `relation_category` | enum | semantic_relation | 关系类别，决定传播方向/增益/衰减 |
| `_seq` | int | 自增 | 稳定序号（不序列化），用于 tie-break |

#### relation_category —— 关系类别（7 类）

| 类别 | 方向 | 衰减倍率 | 增益倍率 | 当前数量 |
|---|---|---|---|---|
| `semantic_relation` | 双向 | 1.0 | 1.0 | 740 |
| `cognitive_relation` | 单向 | 0.5 | 1.3 | 224 |
| `temporal_relation` | 单向 | **1.5**（快淡） | 0.7 | 56 |
| `causal_relation` | 单向 | 0.8 | **1.2** | 33 |
| `social_relation` | 双向 | 0.8 | 0.8 | 24 |
| `emotional_relation` | 双向 | **0.3**（久留） | **1.5**（强） | 5 |
| `procedural_relation` | 单向 | 0.5 | 1.2 | 2 |

读法：情绪边传得最强、留得最久；时间边传得最弱、淡得最快——这符合直觉。

**关系本体**（`config.py:252-287`）：约 60 个中文关系词预先映射到类别（`导致→causal`、`喜欢→emotional`、`参与→social`…），未列出的自由关系默认 `semantic_relation`。

### 4.3 KnowledgeGraph —— 容器

```python
class KnowledgeGraph:
    nodes: dict[str, Node]        # id → Node
    edges: list[Edge]             # ← 唯一真相源

    # 派生索引（性能改造 2026-09）
    _out_index:    dict[str, list[Edge]]      # src → 出边
    _in_index:     dict[str, list[Edge]]      # dst → 入边
    _pair_index:   dict[tuple, dict]          # (src,dst) → {relation: Edge}
    _node_order:   dict[str, int]             # 节点插入序（tie-break 用）

    _lock: threading.RLock
    # 结构变更回调（默认空 = 零开销）
    _cb_node_renamed / _cb_edge_removed / _cb_node_removed / _cb_node_added
```

设计点：

- **不变量**：`kg.edges` 列表是唯一真相，三个索引与它逐条一致（含重复边、悬空边）。批量直写（启动 overlay / pack 导入 / 迁移脚本）后必须调 `rebuild_indexes()`。
- **回调机制**：`_cb_node_added` 被 `embedding_manager.mark_dirty` 订阅 → 新节点一诞生就登记进待索引队列，实现"图写入 → 语义索引跟随"。这是"她每长出一个新认知，语义召回就能找到它"的落地方式。
- **线程安全**：所有修改走 `with self._lock`。扩散引擎持有自己的 `_lock`，两把锁存在嵌套（引擎锁内调图操作），依赖 Python RLock 可重入。

### 4.4 持久化

`kg.save(path)` 走"意外缩小守卫"：节点数腰斩时自动留副本。序列化格式：

## 5. 核心引擎：激活扩散

代码位置：`diffusion_engine.py`（1353 行）——**这是整个系统的心脏**。

### 5.1 论文公式 vs 实际实现

论文（§5.1.1）给出的形式：

```
a_uv(t)      = w_uv + r(u,v,t)              边的有效权重 + 运行时修正
Δa(u→v)(t)   = a(u,t) · a_uv(t) · β / |N+(u)|   按出度归一化的传播量
a(v,t+1)     = (1-λ)·a(v,t) + Σ Δa(u→v)(t)      衰减 + 累积
```

实际代码（`diffuse_step` `diffusion_engine.py:728`）逐条对应，并做了几处工程加固：

```python
# 1) 有效权重 = 静态边权 × 运行时加成（模拟突触可塑性）
w_eff = max(0.0, edge.weight) * (1.0 + edge.activation * 0.6)

# 2) 传播量（正向），total_w 是出边权重和 —— 对应 /|N+(u)|
contribution = node.activation * w_eff * beta * gain / total_w

# 3) 发射能量封顶：一步最多发出自身激活的 emission_ratio（默认 0.5）
budget = node.activation * emission_ratio
if emitted_sum > budget: 全部 node_delta 等比缩放

# 4) 发射即转移：把发出的能量从源节点身上扣掉（除非是锚点）
delta[nid] -= emitted_sum * emission_transfer

# 5) 接收：按目标空间 cap 裁剪
new_val = clip(old + incoming, 0, dst_space.activation_cap)
```

### 5.2 与论文的三处偏离（以及为什么）

| 偏离 | 论文 | 实现 | 原因 |
|---|---|---|---|
| **fire-once** | 每步都能发射 | 一轮内每个节点只发射一次（`_fired_round`） | 无衰减纯累积 + 环路 → 激活值每步翻倍撞 cap，回答区退化成一片并列 |
| **发射即转移** | 发射是复制 | `emission_transfer=1.0` 时源节点扣掉发出的部分 | 旧语义下全网总能量每步可翻倍，唯一平衡点是全部撞上限（实测 40 tick 后 733 节点全亮、374 个钉在 cap 5.0，每 tick 统计完全相同——那不是认知，是一个卡死的固定点） |
| **衰减时机** | 每步 `(1-λ)` | 一轮结束统一衰减一次（`diffuse_round` 末尾调 `decay_step`） | 让信号在一轮内自由传播，不被中途衰减打断 |

> 这三条都有回归护栏：`tests/test_energy_conservation.py`（离线断言中的一部分）锁住"空闲长跑总能量有界、不出现满格节点、回合内排序不被压平、锚点只在回合内有效"。

### 5.3 单步扩散流程

```mermaid
flowchart TD
    A["diffuse_step() 开始"] --> B["遍历活跃前沿 _active_nodes"]
    B --> C{"activation < min_spread_threshold(0.05)?"}
    C -->|是| SKIP1["跳过：弱信号不传递"]
    C -->|否| D{"本轮已发射过? (fire-once)"}
    D -->|是| SKIP2["跳过：一轮只发一次"]
    D -->|否| E{"被 blocking 锁锁定?"}
    E -->|是| SKIP3["跳过：不发射"]
    E -->|否| F["取空间规则 β / 关系规则 gain"]
    F --> G["正向：沿出边 src→dst<br/>contribution = a · w_eff · β · gain / total_w"]
    F --> H["反向：沿入边回溯 dst→src<br/>强度 = 正向 × 0.5（仅双向关系类别）"]
    G --> I["发射预算封顶<br/>emitted_sum ≤ a × emission_ratio(0.5)"]
    H --> I
    I --> J{"是刺激源锚点?"}
    J -->|是| K["不扣自己（照常供能）"]
    J -->|否| L["delta[自己] -= emitted_sum × emission_transfer"]
    K --> M["标记本轮已发射"]
    L --> M
    M --> N["接收阶段：dst.activation = clip(old + Δ, 0, dst空间cap)"]
    N --> O["刷新行动队列（增量）"]
    O --> P{"max_delta < theta_threshold(0.01)?"}
    P -->|是| Q["收敛，round 提前结束"]
    P -->|否| R["继续下一步（最多 max_depth=6 步）"]
```

### 5.4 三个核心 API

| 方法 | 签名 | 作用 |
|---|---|---|
| `activate_from_inputs(node_ids, edge_specs, similarity_map=None)` | `diffusion_engine.py:482` | **注入激活**：给种子节点加激活、给关联边加成 |
| `diffuse_round(max_steps=None)` | `:964` | **跑一轮**：清 fire-once → 最多 6 步 → 统一衰减一次 |
| `diffuse_from(node_ids, steps=1)` | `:936` | **补传播**：只让指定节点发射，其余标记为已发射 |

#### 种子强度怎么算（`activate_from_inputs`）

这是"输入如何变成注意力"的关键，值得用公式说清：

```
无相似度时（LLM 抽取出的实体）：
    bonus = input_default_bonus(0.5) × activation_max(5.0) = 2.5

有相似度时（FAISS 命中）：
    bonus = (sim - floor) / (1 - floor) × activation_max
    其中 floor = input_similarity_floor = 0.5

  例：sim=1.0 → bonus=5.0（满量程，"这个节点就是输入本身"）
      sim=0.75 → bonus=2.5
      sim=0.5  → bonus=0.0（低于地板不算焦点）
```

**地板的用意**（`config.py:42-48` 有详细注释）：相似度 0.5~0.6 的命中多半是高频词/枢纽节点的"人人有份式"匹配。一句"Fascinator"能召回一串 CI 节点（0.58~0.60），它们会把整片邻域泵到饱和，把真正相关的节点挤出回答区。

同时，被本轮点亮的节点会进 `_anchored` 集合（**刺激源锚点**）：它们在发射时免于能量转移，保证回合内排序不被压平。回合边界调 `clear_anchors()` 清理。

#### 种子还会给关联边加成

```
edge_bonus = max(0.1, 0.5 × max(sim[src], sim[dst]))
edge.activation = min(3.0, edge.activation + edge_bonus)
```

加上 LLM 抽出的边精确匹配已有边时 `+0.5`。这就是"突触强化"的来源之一——被反复用到的边 `activation` 累积，下次传播时 `w_eff` 更大。

### 5.5 Top-K：认知焦点是怎么选出来的

`get_topk(k=20)` `diffusion_engine.py:333`

```python
pool = [活跃前沿内 且 未被 non_blocking 锁隐藏 的节点]
top_nodes = heapq.nlargest(k, pool, key=lambda n: (
    n.activation,                              # ① 激活值降序
    last_lit.get(n.id, 0),                     # ② 本轮更晚点亮的优先
    -node_order.get(n.id, 1<<60)               # ③ 入图更早的优先
))
```

tie-break 的三个键有讲究（代码注释直说了原因）：

- ② 的存在是因为**饱和场上 cap 并列很常见**，不能让"最老的节点"靠入图序取胜，否则回答区被早年旧簇占满。
- ③ 是旧版"等值输入序"的确定性保留。

返回的边不是全部边，而是 **Top 节点的出入边**（去重后按 `_seq` 输出），这样回答上下文里的边一定是"焦点之间的关系"。

**关键：只在前沿内取**。前沿外节点的激活已被吸附为 0，旧版用零激活节点填满 k 的行为已被移除——"零激活节点无认知意义"。

### 5.6 行动队列（Action Queue）

`_refresh_action_queue(changed_ids=None)` `:384`

判定条件极其简单：**`label == "procedural"` 且 `activation >= theta_action(0.5)` 且 未被 `scope=action` 的锁排除**。

排序键 `(-activation, 入图序)`，`/api/actions/execute` 取队首。

支持两种模式：
- `changed_ids=None` → 全量重建（`/api/actions` 轮询等调用点）
- `changed_ids=[...]` → 增量：只重估脏集合（回调/直写标记的节点）∪ 本次显式变化的节点

后者的存在是因为在 651 节点的图上，每步全量扫 651 个节点找 procedural 太浪费——而扩散每步都会调它。

### 5.7 锁的 7 个介入点

`COGNITIVE_REGULATION.md` §2 列出了扩散引擎里全部 7 处锁钩子（代码里有显式注释标记 `── 锁介入点 N/5 ──`）：

| # | 位置 | 行号 | 效果 |
|---|---|---|---|
| 1 | 节点激活前（种子循环） | `:533` | blocking 锁：种子拿不到激活 |
| 2 | 边参与扩散前（加成循环） | `:606` | blocking 锁：边不进被加成集合 |
| 3 | 节点发射前 | `:769` | blocking 锁：不向外发射 |
| 4 | 边传播前（正/反向） | `:809`, `:836` | blocking 锁：两个方向都不传 |
| 5 | 目标接收前 | `:891` | blocking 锁：不因他人传播获得注意力 |
| 6 | 进入 Top-K 前 | `:351`, `:369` | **non_blocking** 也过滤 |
| 7 | 活跃快照 / 动作队列 | `:236`, `:416` | `scope=action` 排除出可执行队列 |

**设计克制**：锁只是"从传播中摘除对象"，**不改任何公式**（`total_w` 定义、β、gain、fire-once、能量守恒全部不动）。无锁时七处都是 `bool(reg)` 短路，零开销。

### 5.8 衰减

两级衰减，语义不同：

| 机制 | 参数 | 时机 | 强度 |
|---|---|---|---|
| **轮内衰减** `decay_step()` | 空间 λ（semantic 0.05 / episodic 0.15 / self 0.01） | `diffuse_round` 结束时一次 | 温和 |
| **回合间衰减** `apply_inter_round_decay(factor, floor)` | `inter_round_decay=0.75`，`inter_decay_floor=0.5` | 新输入到达前（`app.py:2227`） | **很强** |

回合间衰减 0.75 的语义（`config.py:31-33` 注释）：*"注意力残留只保留一轮——上一轮的满量程焦点（5.0）衰减到 1.25，低于本轮输入种子，于是'这一轮在想什么'由本轮输入决定，而不是最近五轮的平均。"*

地板 0.5 的语义：一个节点从 cap(5.0) 开始，约 5 轮未被激活后归零。这比原来的 0.001 大大截断了无关节点的噪声传播。

边衰减 = 源节点空间 λ × 关系类别 decay_mult（时间关系 1.5 倍最快淡出）。

### 6.2 逐阶段文字说明

#### 阶段 0 · 前置与让位（`:1932-1948`）

```python

```

**"用户优先"是硬编码的**，不需要 LLM 判断谁更重要。

#### 阶段 1 · NLP 感知（`:1988-1999`）

`nlp.process(text)` 一次 LLM 调用，返回结构化解析。随后 `_fuzzy_match_node` 把 LLM 输出的名字归并到图里真实存在的节点 ID：

归并优先级（`app.py:977`）：**完全匹配 > 别名匹配（`extra_attrs.aliases`）> 包含匹配（≥3 字且占比 ≥60%）> 边界匹配打分**。

包含匹配的存在是为了处理 LLM 措辞波动：`收获日2` ⊂ `收获日2游玩`。防护是"较短方长度 ≥3 且占比 ≥60%"，避免"两个礼拜"被长事件名误吞。

#### 阶段 2 · 多路信号注入

这是"万物皆图"最密集的地方——所有信号都以**点燃图节点**的方式进入，没有旁路：

| 信号源 | 注入方式 | 行号 |
|---|---|---|
| 坐标点击指令 | 建 `坐标(X=..,Y=..)` 节点 + `点击-[目标]→坐标` 边 | `:2005` |
| 社交互动 | 注入 `社交互动` 节点（`illocutionary_act=expressive` 或社交类 `dialogue_act`） | `:2046` |
| 话题终止指令 | `mark_termination()` + 注入社交互动 | `:2041` |
| 情绪共振 | 扫图中所有 `type=emotion` 节点，出现在用户文本里就 `inject_emotion(kg, text, emotion)` | `:2063` |
| FAISS 语义召回 | 每个输入词搜 `top_k=faiss_recall_topk(8)`，相似度 ≥0.3，只注入图中存在且 `is_cognitive_visible` 的节点 | `:2083` |
| 好奇心回答解析 | 有待答好奇问题时，本次输入视为回答 | `:2111` |

    engine.diffuse_round()                        # 完整一轮
```

**分阶段扩散**是个精巧的设计：3 步正好让信号到达"生成好奇问题"节点而不过冲（overshoot）。用显式的 `diffuse_round(max_steps=)` 表达，而不是临时改写 `config["max_depth"]`。

#### 阶段 4 · 动作执行（`:2291-2400`）

四类动作，触发条件都是**模式匹配 + 图状态**：

| 动作 | 触发 | 执行 | 留痕 |
|---|---|---|---|
| **网络搜索** | 显式意图词（"搜一下"）或 提问型输入引入 ≥2 个图外概念 或 情绪/陈述含字母数字型图外概念（C2/5G） | `actions/web_search.do_web_search()` | 建 `搜索记录_{ts}` procedural 节点 + `执行`边 + `涉及`边连到查询中的已有实体 |
| **文件操作** | 正则匹配"创建/新建/写/生成 + 文件" | LLM 抽参 `file_action_extract` → `execute_file_action()` | 建 `文件操作记录_{ts}` 节点 |
| **屏幕 OCR** | "看看/识别/截屏" + "屏幕/画面" | `eye.screen_ocr.recognize_text()` | 建 `eye_text_{ts}` 节点，带显著文本+屏幕方位 |
| **时间锚定** | 时间指示语（"现在/今晚/熬夜/凌晨"） | `temporal_awareness.ground()` | 激活对应时段节点，事件挂 `发生于时段` 边 |

**Minecraft 反射指令**（`:2690-2734`）值得单独说：这是一条**零 LLM 的快速通路**。`minecraft_reflex.parse_reflex_command()` 是纯函数，专门单独成文件，因为"原来这段解析长在 app.py 的请求处理里，用一串位置分组硬凑参数，结果出现了三类真 bug"（模块头注释详细记录了：否定句被当肯定句、分组错位导致 `attack("")` 攻击最近非玩家实体、秒数解析 ValueError）。现在的原则是：**第一步就判否定；每个动作按具名语义解析；取不到目标就如实拒绝，绝不"就近挑一个"**。

#### 阶段 5 · 记忆抽取与沉淀（`:2402-2515`）

先判要不要抽取（`_should_extract_memory`）：非教学型 `dialogue_act`（问候/告别/感谢/道歉/情绪表达/提问/请求/观点…）**不抽取**，除非 `memory_type` 明确是 episodic/semantic。

抽取路径二选一：

- **叙事路径**：`narrative_score(text)` ≥ 阈值（balanced 0.45）→ `extract_narrative()` → 建"故事节点 + 按序事件实例 + 角色原子节点"，事件之间用 `时间顺序` 边串成链。用于"用户讲述他人/虚构故事"。
- **常规路径**：`extract_assertion_graph(text, topk_check, focus_events)` → 事件框架入库。

**事件框架**（`app.py:1060-1097` 有完整说明）是情景记忆的结构：

```
用户 -[参与/态度]→ 事件节点 -[涉及/参与者/发生时间/引发]→ 实体/时间/情绪
```

- 事件节点落 `episodic` 空间并带 `event_timestamp`
- 时间字符串新建为 `semantic` 空间的**时间锚点节点**（共享参考实体）
- `_update_focus_event()` 把 `当前焦点事件` 指针移到事件（有父事件时聚焦父事件）

**新实体补激活**（`:2486-2505`）：抽取出的节点在扩散期还不在图里，所以扩散错过了它们。补激活后还要补**一步只从新实体发射**的传播：

> *"只补激活不补传播的话它的邻域（关联能力、时间桶、相关实体）照旧是暗的。必须走 `diffuse_from`：否则整片前沿会重新发射一轮，把邻域泵到饱和，回答区退化成一堆 cap 并列。"*

#### 阶段 6 · 决策（`:2517-2585`）

两条线并行：

**A. 上一轮表达的 outcome 标注** —— 从 `buffer.last_unannotated_expression()` 取出上一轮她说了什么，用本轮用户输入判断那个表达的结果（正/负/中性）：

```python
_outcome, _detail = classify_outcome(prev_expr, text, parsed, gap)
buffer.annotate_expression(prev_expr, _outcome, _detail)
cc.note_outcome(_outcome == "negative")        # 表达抑制信号
persona.mood_event("positive" if ... else "negative")
disposition_store.apply_outcome(context, behavior, outcome,
                                evidence_ref=text[:60],
                                source="user_feedback", allow_create=True)
```

这是**人格/表达风格学习的闭环**：她说了什么 → 用户反应 → 倾向边权强化或衰减。
（2026-09-18 修复：旧版 turn 级 `apply_outcome` 只回写已存在的 pair，绝大多数反馈被静默丢弃；
现已扩展 outcome 四态、多来源证据、首条经历建 candidate，详见 `docs/self_learning_loop_fix.md`
与 `tests/test_self_learning_loop.py`。）

**B. 交流决策 `dialogue_decide()`** —— 要不要回应，由图谱信号竞争决定：

输入因子：言语行为的回应拉力（`ACT_PULL` 表）、回应期待、话题共振（TopK 激活）、行为倾向、好奇信号、表达抑制（刚说过/负反馈）、文字投入度。

输出三态：`respond` / `minimal`（可极简）/ `silence`（**不回应是合法结果**）。

还有回应约束生成：`no_question`（用户分享事实且无信息需求时禁机械追问）、`ack_only`（话题终止指令后只简短确认）、`minimal_len`。

#### 阶段 7 · 语言实现（`:2587-2866`）

最后一道门是 `LLM回答` 节点的激活值：

```python
llm_node = engine.name_to_node.get("LLM回答")     # 一个 procedural 节点
if llm_node.activation >= theta_action(0.5):
    raw_topk, topk_edges = engine.get_topk(k=20)
    topk_nodes = [过滤掉基础设施/坐标节点/被锁节点]
    ...
    llm_answer = nlp.answer_question(text, topk_nodes, knowledge_edges,
                                     context_type=_ctx_type, cognitive_context=_cog_ctx)
```

**`_cog_ctx`（认知上下文）是送给 LLM 的完整"此刻在想什么"**，包含 14 个字段：模式+需求分数、注意力上下文、言语行为、对话行为、回应期待、建议的回复目标、行为倾向（已剔除沉默）、网络搜索结果、文件动作、屏幕结果、回应约束（非 Web 通道追加"场合约束：短、单行、不要 Markdown"）、Minecraft 动作结果、近期对话 6 轮、世界状态快照、当前心情、认知触发事件。

**世界状态只在真正连着世界时注入**（`:2781` 注释）：*"断开时图里留的是上次的值，拿旧坐标当'我现在在这里'回答就是撒谎。"*

**回答生成前有两道保险**：
1. `demand_score → mode_for_demand`：认知需求评分决定 LLM 参与模式（MODE0 图自足 / MODE1 仅语言 / MODE2 解释 / MODE3 推理 / MODE4 反思 / MODE5 深度）
2. `llm_budget.can_call(mode)`：预算门控。拒绝则 `llm_answer = None`，**图谱继续，降级为不回答**

#### 阶段 8 · 收尾（`:2868-3138`）

一串后置钩子，全部有 try/except 保护（一个失败不影响其他）：

```
internal_state.end_cycle(cycle_id, outcome={answered, curiosity, faiss_hits})
_save()                              # 异步存盘
engine.clear_anchors()               # 回合边界清锚点
cc.set_busy(False)                   # 恢复后台循环
engine.stop_auto()
chat_log.record(user_input, system_response, curiosity...)
buffer.add_expression({...})         # 表达事件入缓冲（不落图）
self_updater.process_turn(...)       # Self Model 更新（重要性门槛过滤）
reflection_engine.check_triggers()   # 反思触发检查
drive_evaluator.evaluate()           # 驱动力评估
action_selector.evaluate()           # 能力评估 + persist_intent
```

### 7.1 NLP 感知器

代码：`nlp_processor.py`（1139 行）

**主入口** `process(text)` `:165`：

```python
raw_result = self.chain.invoke({"text": clean_text, "current_date": "2026年09月14日 Sunday"})
parsed = self._sanitize_result(raw_result)
# 失败会自动重试一次；再失败返回默认结构（不抛异常）
```

`chain = RECONSTRUCT_PROMPT | self.llm | JsonOutputParser()` —— LangChain 管道。

**输出 schema**（`_sanitize_result` `:219` 保证结构）：

```json
{
  "nodes": ["用户", "阿司匹林", "药"],           // 去重、去代词、代词映射
  "edges": [{"src":"...","dst":"...","type":"...","weight":0.0~1.0}],
  "illocutionary_act": "assertive",              // 5 类言语行为
  "dialogue_act": "information_statement",       // 对话行为细分类
  "response_expectation": "low|medium|high",     // 回应期待
  "suggested_reply_goals": ["acknowledge"],
  "memory_type": "semantic|episodic"
}
```

**清洗规则**（`:234-236`）：

```python
DROP = {"他","她","它","他们","她们","他的",...}          # 代词直接丢弃
SELF_MAP = {"我":"用户","我的":"用户","你":"Fascinator","你的":"Fascinator"}
```

这条映射是**自我/他者视角归一化的关键**：用户说"我"必须变成图里的 `用户` 节点，"你"变成 `Fascinator`。

### 7.2 言语行为与对话行为

**5 类言语行为**（Searle 分类）与对应反应链：

| 类别 | 说明 | 图上的反应链 |
|---|---|---|
| 断言类 | 陈述/描述事实 | → 知识存储 → 存入记忆 |
| 指令类 | 命令/请求/提问 | → 询问处理 → LLM回答 |
| 承诺类 | 承诺/意图/计划 | → 意图注册 → 行动计划 |
| 表达类 | 情感/态度 | → 情感记录 → 情绪节点 |
| 宣告类 | 宣告/命名/声明 | → 声明注册 → 写入图谱 |

**`dialogue_act`** 是更细的分类（约 20 种），直接驱动流程分支：
- 社交类 `{greeting, farewell, thanking, apology, emotion_expression, sharing}` → 注入"社交互动"节点
- 非教学类 `{greeting, ..., question, request, opinion, ..., backchannel, suggestion, curiosity_expression, answer}` → **不触发记忆抽取**

### 7.3 复合短语处理

代码：`compound_phrase_handler.py`（986 行）

**解决什么问题**：中文里"代表产品""创始人"这类短语，如果按普通名词处理，会被好奇心机制误判为"未知概念"从而触发打断性反问。但实际上它们是**关系型短语**——已经有对应的边存在。

**三分类判定**：

| 类别 | 含义 | 处理 |
|---|---|---|
| **关系型**（relational） | "代表产品" = 一条 frame 查询 | 过滤出 curiosity 候选；生成 `frame_queries` → 相关边 `activation += 1.2`（强 boost，使匹配的边在扩散中传更强信号） |
| **词汇化**（lexicalized） | 已经固化为词的短语 | 正常处理 |
| **绝对名词** | 普通名词 | 正常处理 |

**Frame 查询结构**：`{frame: "代表产品", attribute_type: "...", possessor: "麦当劳", slot_id: "...", query_description: "..."}`

词语槽表持久化在 `data/relation_phrase_table.json`，并且会**随使用积累**（"语言理解广度"的自学通路）。

### 7.4 对话决策与 LLM 参与模式

**`dialogue_decision.py`（155 行）** — 回应欲望认知竞争

回应拉力基线表 `ACT_PULL`（按言语行为类别给基线值）、话题终止正则 `_TERM_RE`（"停止话题/换个话题/别说了/打住/到此为止"）。

话题终止后 `inhibit_topics(kg, engine)` 抑制当前话题节点激活，硬编码 600s 抑制期（`COGNITIVE_REGULATION.md` §7.2 明确指出这是"与对象型认知锁不同轴"的遗留设计，未来应统一为带 `expires_at` 的锁）。

**`cognition_modes.py`（246 行）** — LLM 参与模式与预算

六个模式（按成本递增）：

| 模式 | 名称 | 何时用 |
|---|---|---|
| MODE0 | `graph_only` | 图谱自足：扩散/竞争/倾向/意图/触发，零 LLM |
| MODE1 | `language` | 把已形成的认知状态说成人话 |
| MODE2 | `interpret` | 图谱无法可靠解释输入时，LLM 作认知解释器 |
| MODE3 | `reason` | 多步/反事实/远距离组合推理 |
| MODE4 | `reflect` | 低频反思/倾向形成/人格统计 |
| MODE5 | `deep` | 最昂贵：仅用户明确要求/重大缺口/高价值目标 |

认知需求评分输入：输入不确定度 / 新颖度 / 冲突 / 语言复杂度 / 推理深度 / 目标重要性 / 好奇心 / 情绪显著性 → `demand_score` → `mode_for_demand`。

`BudgetManager`：`max_calls_per_turn` / `per_minute` / `max_tokens_per_turn` / `daily_budget`，按 mode 的权重与冷却；profile 有 `development / balanced / economy / full` 四档（当前用 balanced）。

**关键**：本模块**不做任何 LLM 调用**，只做评估与配额（"万物皆图：评估读图谱状态"）。失败策略是返回 None → 调用方降级。

### 8.2 情景缓冲区 `episodic_buffer.py`（321 行）

**容量 100**，存"还没晋升到长期图谱的经历"。

三条数据流：
1. `add_experience(raw_text, nodes, edges, assertion_type)` — 本轮抽取的记忆草稿
2. `get_promotion_candidates()` — 晋升候选
3. `add_expression({...})` / `last_unannotated_expression()` / `annotate_expression(...)` — **表达事件**（她说的话 + 结果），这是 Reflection Evolution 的基础设施

表达事件字段：`user_text, answer, behavior, context, context_ids, dialogue_act, response_expectation, topics, silence_chosen`。

### 8.3 自我模型

两个模块，容易混淆，职责如下：

| 模块 | 行数 | 职责 |
|---|---|---|
| `self_graph.py` | 864 | **Self 节点的图操作原语**：偏好即边权、情绪即节点、目标即节点、经历连 Self |
| `self_model.py` | 852 | **持续性主体模型**：重要性门槛、知识溯源、防污染 |

`self_graph.py` 的模块头写着最硬的设计约束：

> *"禁止新增 PersonalityManager / EmotionManager / ... 或任何独立保存状态的 Python 对象。即：不要存储结果，而是存储关系。"*

`self_model.py` 的三个组件：

- `SelfGraphManager` — Self 空间的结构化读写接口
- `evaluate_importance(parsed, context)` — **无状态**重要性评估函数
- `SelfMemoryUpdater` — 编排器：接收 NLP 输出 → 评估 → 决策 → 写入

**重要性评分权重**（`config.py:355-382`）：

| 因子 | 权重 | 含义 |
|---|---|---|
| `explicit_statement` | 0.40 | 用户明确说"我喜欢/我相信/我是" |
| `repeat_count` | 0.25 | 相似内容重复出现次数 |
| `emotion_intensity` | 0.15 | 当前激活情绪节点数 × 激活度 |
| `llm_confidence` | 0.10 | LLM 抽取置信度 |
| `temporal_recency` | 0.10 | 最近强化距今（30 天内线性衰减） |

门槛：`importance_threshold=0.5`；`source="single_observation"` 需要 `min_observations≥2`；社交/情绪表达下重要性降权 0.4（`social_dialogue_weight_penalty`）。

**知识溯源**：每个 belief/preference 携带 `provenance` 字段（`confidence, source, evidence_count, first_observed, last_reinforced`）。

### 8.4 好奇心引擎 `curiosity_engine.py`（726 行）

模块头明确：*"好奇心不是聊天技巧，而是 Fascinator 的一种认知机制。目标不是提高聊天能力，而是模拟'遇到不知道的东西会产生好奇'。"*

**触发条件**（满足任一，信号边直达 `好奇` 节点）：

| 信号 | 图路径 |
|---|---|
| 输入出现未知节点 | `未知概念 -[触发]-> 好奇` |
| 未知属性 | `未知属性 -[触发]-> 好奇` |
| 未知关系 | `未知关系 -[触发]-> 好奇` |
| 未知信息 | `未知信息 -[触发]-> 好奇` |
| 用户表达情绪 | `需要确认 -[触发]-> 好奇` |

**P0-2 的重要改造**（模块注释）：原来的 `CURIOSITY_CHAIN` 是 15 条边组成的"好奇心应该如何发展"的**剧本**（未知→知识缺口→好奇→生成→等待→更新→完善→结束）。现在只保留 **7 条信号边**——六个未知/确认信号直达 `好奇`，好奇驱动 `生成好奇问题`。回答后的记忆更新由 `resolve_curiosity` 直接激活相应节点，不靠剧本接力边。

**限定**：一次输入最多生成 1 个问题；`等待回答` 状态存在时禁止再次生成（避免连环追问）。

**状态图内化**：活跃好奇问题挂在 `等待回答` 节点的属性上，**没有图外工作记忆，重启不丢失**。

### 8.5 反思引擎 `reflection_engine.py`（559 行）

三种触发：

| 类型 | 条件 |
|---|---|
| `periodic` | 每 20 轮对话（`periodic_interval_turns`） |
| `event` | 累计情绪激活度 > 3.0（`emotion_trigger_threshold`） |
| `user` | 用户主动要求（`POST /api/self/reflection`） |

还有第四种：`continuous_cognition` 的**离线反思自问**（长时间静默 + 有未反思表达时触发）。

**流程**：收集输入 → LLM 分析 6 个必答问题 → 解析候选 → 审批。候选带 `confidence + importance + approval_status`。

`auto_approve_threshold=0.75` 以上的候选自动批准，其余进 `pending`（**pending 状态的候选不影响 Self Model 实际取值**）。

`docs/fas_cognitive_architecture_v2.md` §7.6 提出了对反思的检验标准：

> *"任何一条反思，三个月后必须能回答'它改变了哪条边/哪个节点'——答不出即该反思无效，反思模板需带'预期落点'字段。"*

### 8.6 驱动力 `drive_engine.py`（287 行）

Phase 3 MVP，目前只有 **Curiosity Drive** 一个。路线图：Curiosity → Social → Learning → Consistency。

原则：*"不是 if-else 规则 — 驱动力来自图谱状态统计"*。

`DriveEvaluator.evaluate()` 读取图信号算 `CuriosityDrive` 节点激活：
- 未知信号节点数（`未知概念/未知关系/未知属性/未知事件/未知信息`）权重 0.5
- 知识缺口激活倍率 0.8
- `UnknownObject` 数量权重 0.3
- 好奇心链路倍率 1.2

### 8.7 行为倾向 `disposition_store.py`（392 行）

这是**人格学习**的落地机制（Reflection Evolution R2）。

**图结构**（self 空间）：

```
情境:用户分享 -[产生]-> 倾向:追问@用户分享 -[指向]-> 行为:追问
情境:用户分享 -[激活 weight=strength]-> 行为:追问
```

`pair` 节点 `extra_attrs` 存证据计数 / 正负反馈 / 证据引用；激活边权重与 `strength` 同步。

**封闭词表**（防节点爆炸，节点总数上界 ~20）：

- 行为词表：`respond`(回应) / `ask`(追问) / `acknowledge`(确认) / `elaborate`(详述) / `empathize`(共情) / `share`(分享) / `continue`(延续) / `closing`(收尾) / `silence`(沉默)
- 情境词表：`情境:熟悉关系` / `情境:用户分享` / `情境:用户情绪表达` / `情境:用户提问` / `情境:用户观点` / `情境:主动发起` …
- 修饰符：`MODIFIER_EMOTION_LOW`、`MODIFIER_FAMILIAR`

**候选→稳定规则**：一次经历只能产生 `candidate`；`stable` 需要**真实经历证据** `positive_count+negative_count >= 4` 且正反馈占优势（2026-09-18：旧版误把出厂引用计入 `evidence_count`，现只数真实 outcome）。

**基线人格**（`personality_baseline.py`，106 行）播种 6 条出厂先验：

```python
("情境:熟悉关系", "respond", 0.45)      # 熟悉的人面前自然接话
("情境:熟悉关系", "empathize", 0.35)    # 亲密关系的基础敏感度
("情境:用户分享", "respond", 0.40)
("情境:用户情绪表达", "empathize", 0.30)
("情境:用户提问", "respond", 0.45)
("情境:用户观点", "respond", 0.30)
```

这些是**低强度种子**，之后由真实经历 outcome 强化/衰减。同时管理**心情瞬态**（valence ∈ [-1,1]，每小时向 0 衰减 0.15，正向事件 +0.12、负向 -0.18）。

4. `graph_model.save()` 新增"意外缩小"守卫（节点数腰斩时自动留副本）

## 9. 自主性：无输入时她在做什么

### 9.1 持续认知循环 `continuous_cognition.py`（568 行）

**唯一的后台线程**（`continuous-cognition`，daemon）。tick 间隔 **2.5 秒**。

```mermaid
stateDiagram-v2
    [*] --> Tick
    Tick --> BusyCheck: 每 2.5s
    BusyCheck --> Tick: /api/nlp 处理中<br/>set_busy(True) → 让位
    BusyCheck --> Decay: 空闲
    Decay --> Diffuse: engine.decay_step()
    Diffuse --> Reignite: engine.diffuse_step()<br/>（手动 auto 模式开启时跳过）
    Reignite --> Pulse: 每 3 tick<br/>记忆再点火
    Pulse --> Think: 每 4 tick（≈10s）<br/>认知脉冲（零 LLM）
    Think --> Autonomy: 每 12 tick（≈30s）<br/>低频自由思考（1 次 LLM）
    Autonomy --> Monitor: 每 4 tick<br/>自主行动决策
    Monitor --> Index: 每 4 tick<br/>状态检测器轮询
    Index --> OfflineReflect: 每 5 tick<br/>新节点增量编入 FAISS
    OfflineReflect --> Tick: 长时间静默+有未反思表达<br/>触发离线自问
```

| 节拍 | 频率 | 做什么 | LLM |
|---|---|---|---|
| tick | 2.5s | 衰减 + 扩散一步 | 零 |
| `reignite_memory` | 每 3 tick | 从 episodic 空间挑最近的记忆事件重新点亮（`reignite_boost=1.2`） | 零 |
| `_pulse` | 每 4 tick (≈10s) | **认知脉冲**：评估图状态 → 形成/增强交流意图（CI） | 零 |
| `_free_think` | 每 12 tick | 低频自由思考，最小间隔 15 分钟 | 1 次 |
| `autonomy.tick()` | 每 4 tick (≈10s) | 自主行动决策 | 零 |
| `regulation.poll_due()` | 每 4 tick | 状态检测器轮询 | 零 |
| `flush_pending` | 每 5 tick | 把新节点增量编入 FAISS | 零（只编码） |
| `_maybe_offline_reflect` | 每 tick 检查 | 长时间静默 + 有未反思表达 → 反思自问 | 1 次 |

**认知脉冲评分**（`_pulse` `:152`）：

```python
score = (0.5 × min(top_act / 3.0, 1.0)      # 峰值激活
       + 0.25 × social                       # 情绪在场 + 与用户关联度
       + 0.15 × affordance                   # 可供性（好奇心活跃/上次结果正面）
       + 0.10 × min(user_relevant / 3.0, 1.0))  # 用户相关节点数
```

- `form_threshold = 0.55` — 意图形成阈值
- `express_threshold = 0.78` — **高于形成阈值**：能形成意图 ≠ 该主动说出来
- `discard_below = 0.10` — 丢弃
- 冷却：主动表达后 5 分钟；每小时最多 6 次

与已有 CI 重叠 ≥40% → 视为同一认知状态，**增强而非新建**（防节点爆炸）。

### 9.2 自主行动闭环 `autonomy.py`（980 行）

**通用自主层，不认识 Minecraft**。

```mermaid
flowchart LR
    A["具身感知<br/>embodiment.perceive()"] --> B["图更新<br/>感知节点/未知节点/扩散"]
    B --> C["候选生成<br/>图激活·驱动力·新颖性·<br/>未完成目标·最近结果·环境变化"]
    C --> D["目标竞争<br/>结构化评分"]
    D --> E{"score ≥ 0.35?"}
    E -->|否| IDLE["如实 idle<br/>'没有任何可解释的依据'"]
    E -->|是| F["可行性检查<br/>锁·能力·目标在场·重试上限·冷却"]
    F -->|不可行| BLOCK["放弃/如实报告"]
    F -->|可行| G["执行<br/>embodiment.execute(intent)"]
    G --> H["结果反馈<br/>episodic 节点 + 情绪 + 抑制链 + 检测器"]
    H --> A
```

**八种语义意图**：`observe` / `approach` / `follow` / `explore` / `collect` / `rest` / `communicate` / `withdraw`

**评分公式**（`DEFAULT_WEIGHTS` `autonomy.py:65-73`）：

```
score = 0.30·drive      # 相关驱动力强度（CuriosityDrive 等）
      + 0.25·attention  # basis 节点在图中的真实激活值
      + 0.20·novelty    # 新颖性（未知对象）
      + 0.10·tendency   # 行为倾向（情境:主动发起）
      - 0.35·risk       # 风险惩罚
      - 0.25·recency    # 刚做过同类动作
      - 0.30·failure    # 最近失败过
```

所有分量归一化到 `[0,1]`，权重表是"最小可替换接口"——想改"她更看重什么"就改这张表。

**候选生成表**（只在有真实信号时产生）：

| 信号来源 | 产生的意图 |
|---|---|
| 感知到不认识的生物（图里有 `UnknownEntity_*`） | `observe` / `approach`（保持安全距离） |
| 敌对生物进入危险距离 / 血量或饥饿过低 | `withdraw`（安全优先，压过探索）/ `rest` |
| 同伴玩家在场 | `follow`；只有**已备内容**时才 `communicate`（不编台词） |
| 附近有安全清单内的材料 | `collect`（只挖 木头/圆石/沙子/泥土/煤矿，**绝不碰箱子/工作台/建筑**） |
| 很久没探索 | `explore`（方向轮转 = 访问最少的方向，确定性） |
| 都没有但有可看的东西 | `observe`（低分兜底） |

**"没有依据就不产生意图"**：`basis` 为空的候选不会被评分通过，循环进入 `idle` 并在 `state_reason` 里说明"没有任何可解释的依据（不编造想法）"。

**频率控制**：最小间隔 12s、同类动作冷却窗口 180s、失败退避 45s、同一 `(意图,目标)` 最多 3 次、在飞动作 20s 超时。

**安全约束**（AUTONOMY.md §11）：
- Bot 未连接 → 能力面为空 → 不执行任何动作
- 用户交互 → 让位 + 打断在飞动作（安静期默认 20s）
- **不做攻击**：能力面不含 `attack`
- **不碰用户资产**：箱子/工作台/熔炉被显式拒绝
- 失败不无限重试：最多 3 次 + 退避，到上限如实"放弃"

**LLM 边界**：

| 级别 | 位置 | 状态 |
|---|---|---|
| Mode 0（默认） | 感知/候选/竞争/可行性/执行/反馈/冷却/重试 | **零 LLM 调用**（测试断言：多次 tick 后 LLM 计数为 0） |
| Mode 1 | `POST /api/autonomy/goals {"text":"..."}` 自然语言 → 结构化目标 | 已实现，需预算余量 |
| Mode 2 | 动作失败且 `llm_mode>=2` 时只打标记 `needs_reflection` | 已实现；**自主循环自己绝不调 LLM** |

### 9.3 内部状态层 `internal_state.py`（587 行）

**角色**：需求 / 神经调制变量 / 性格的**唯一可写状态源**。

三层分工（模块头 §B）：
1. **图谱层**：只承载"可解释状态节点"（每个变量一个**镜像节点**，in-place 更新，绝不按轮次建节点）
2. **运行时状态层（本模块）**：数值真源，落盘 `data/internal_state.json`（原子写）
3. **控制器层**：每轮/每 tick 确定性更新

三条不变量（实现与测试共同保证）：
- **I1**：运行时状态只有本模块一个写入口，其它模块只读
- **I2**：每轮/每 tick 生成 `cycle_id`，所有状态写入都带它
- **I3**：数值写入一律经 `apply_delta/set_value`：先裁剪到范围，再记历史与来源

**四个调制变量**（功能抽象，模块头明确声明"不声称精确复现人体内分泌系统"）：

| 变量 | 初值 | 基线 | 每分钟回归率 | 语义 |
|---|---|---|---|---|
| `dopamine` | 0.50 | 0.50 | 0.02 | 奖励与学习调制（**拆 tonic 慢变量 / phasic RPE 脉冲**） |
| `cortisol` | 0.30 | 0.30 | 0.05 | 压力与威胁调制 |
| `serotonin` | 0.55 | 0.55 | 0.01 | 稳定性与抑制调制 |
| `oxytocin` | 0.40 | 0.40 | 0.03 | 社交联结调制 |

**四个需求**：

| 需求 | 初值 | 设定点 | 理想区间 | 基权重 | 关联性格 | 关联调制 | 目标类型 |
|---|---|---|---|---|---|---|---|
| `safety` | 0.20 | 0.0 | [0, 0.30] | 1.00 | caution, risk_tolerance | cortisol | rest, withdraw |
| `exploration` | 0.55 | 0.30 | [0.20, 0.50] | 0.85 | exploration_bias, novelty_preference | dopamine | observe, approach, explore |
| `competence` | 0.40 | 0.25 | [0.15, 0.45] | 0.75 | persistence | dopamine, cortisol | collect, goal_progress |
| `social` | 0.35 | 0.30 | [0.20, 0.50] | 0.80 | social_openness, feedback_sensitivity | oxytocin | follow, communicate |

**八个性格维度**（出厂中性偏好奇/友好）：

`exploration_bias` 0.55 / `risk_tolerance` 0.45 / `social_openness` 0.60 / `persistence` 0.50 / `caution` 0.50 / `novelty_preference` 0.55 / `resource_thrift` 0.50 / `feedback_sensitivity` 0.60

**周期 API**：

```python
begin_cycle(kind="turn", meta) → cycle_id      # /api/nlp 开头调用
end_cycle(cycle_id, outcome={...})             # /api/nlp 结尾调用
apply_delta(kind, name, delta, source, cycle_id, reason)  # 唯一写入口
set_value(kind, name, value, ...)
explain(cycle_id)                              # 可解释性查询
```

## 10. 认知调节：锁 / 状态检测器 / 触发器

三项**全程确定性（无 LLM 参与运行）**的基础机制。代码：`cognitive_locks.py`（505）、`state_monitors.py`（434）、`cognitive_triggers.py`（506）、`cognitive_regulation.py`（215，协调器）。

### 10.1 事件链路

```mermaid
flowchart LR
    A["状态提交 / 轮询<br/>（确定性）"] --> B["StateMonitor<br/>状态+变化识别"]
    B --> C["状态事件<br/>（去重）"]
    C --> D["TriggerEngine<br/>结构化条件评估"]
    D --> E["认知事件<br/>动作派发"]
    E --> F1["激活图谱节点<br/>（受锁约束）"]
    E --> F2["record 记录"]
    E --> F3["notify 通知<br/>llm_mode≥1 时进认知层"]
```

### 10.2 锁 `cognitive_locks.py`

**锁控制"某个认知对象是否参与某个认知过程"**。它**不是**删除、不是隐藏、不是负权边：

| 对比 | 区别 |
|---|---|
| vs 删除 | 删除是数据操作；锁不改对象数据一个字节 |
| vs 负权边 | 负权边是关系语义（参与计算）；锁是控制机制 |
| vs 隐藏 | 隐藏是展示层白名单；锁是认知过程级、可解释、可审计、可解除 |

**两种锁型**：

| 锁型 | 语义 | 扩散中的表现 |
|---|---|---|
| `blocking` | 阻止参与 | 不被种子激活、不发射、不接收 → 激活值恒为 0 |
| `non_blocking` | 允许内部处理，限制认知输出 | 照常传播（下游能收到），但不进 Top-K / 活跃快照 / 回答区 |

**作用范围**：

| scope | blocking | non_blocking |
|---|---|---|
| `diffusion` | 不参与扩散 | 参与扩散，不进输出 |
| `topk` | 不进 Top-K | 同左 |
| `action` | 不进可执行队列 | 同左 |
| `all` | 三者都拦 | 三者都过滤 |

未知 scope 会被**存下但当惰性处理**（不做任何拦截）——"不假装支持没实现的钩子"。

**组合规则**：同类型锁之间是**并集**（任一生效即拦）；`priority` 不改变并集语义，只决定对外展示的原因取哪条。

**生命周期**：创建 → 启用/禁用 → 更新 → 删除 → 过期（`expires_at` 自动停用并留审计）→ 悬空锁（目标被删后保留并标记 `target_missing`，不静默消失）。所有状态变化进审计环 `history`（最近 200 条）。

### 10.3 状态检测器 `state_monitors.py`

**状态与事件分离**：`current_value` 是"现在是什么"（持久化），`state_changed` 是"发生了什么变化"（带 previous/current/delta/时间戳/事件 id）。

**相同状态重复提交不产生事件**（去重），只刷新观测计数与时间。

字段：`state_type`（number/bool/string/enum/object）、`unit`/`schema`/`epsilon`（校验）、`source`/`mode`/`poll_interval_s`（数据来源）、`changes`（最近 50 条变化）。

运行方式：`event`（外部事件提交，本阶段主用）/ `manual`（显式提交）/ `poll`（调度器定期查询，接口就绪但**本阶段不内置任何数据源**）。

校验失败**不污染当前状态**，只记 `last_error`。

### 10.4 触发器 `cognitive_triggers.py`

条件必须**结构化**，运行时不交给 LLM 判断：

```json
{"op": "gt|gte|lt|lte|eq|ne|changed|in|all|any|not",
 "field": "current|previous|delta|observation_count|confidence",
 "value": ..., "values": [...], "conditions": [...]}
```

`field` 只允许读事件/检测器里确实存在的量，**不接受任意表达式求值**。

| 要素 | 实现 |
|---|---|
| 触发时机 | `fire_mode=edge`（默认，条件"不满足→满足"跃变才触发，上一轮结果持久化）/ `level`（为真即触发，靠冷却约束） |
| 冷却 | `cooldown_s`；冷却期内请求被**明确拒绝并写入日志**（不静默） |
| 一次性 | `once=true` 触发后自动停用，保留记录 |
| 优先级 | 同轮多触发器按降序派发 |
| 触发记录 | `log` 环（最近 200 条，含 `fired` 与 `skipped`+原因） |
| 错误可见 | 条件评估异常记 `last_error` + `error_count`，不中断引擎 |

动作类型：`activate_nodes`（走 `engine.activate_from_inputs`，因此**自动受锁约束**）、`record`、`notify`。

### 10.5 LLM 介入边界

| 级别 | 位置 | 状态 |
|---|---|---|
| **Mode 0 确定性** | 状态更新、变化判定、去重、条件评估、锁判定、触发调度、冷却 | **全部实现，链路中没有任何 LLM 调用** |
| **Mode 1 结构化辅助** | `POST /api/regulation/triggers/parse`：自然语言 → 候选触发器定义（不落盘，人工确认后再创建） | 已实现（`nl_to_trigger`，需注入 LLM 函数；解析失败如实报错不猜测） |
| **Mode 2 认知推理** | 触发事件带 `llm_mode=2` 标记，由认知层按需取用 | 接口已实现：`drain_cognitive_events(llm_mode_min=1)` 把事件交给回答层渲染【认知触发】块；**Mode 0 的事件永不进入任何 LLM 通路** |

**取用即推进水位**：旧事件不会在后续每轮反复进入 prompt。

## 11. 具身与环境接口

### 11.1 对话通道抽象 `conversation_channel.py`（363 行）

**问题**：FAS 的对话入口原本只有 Web 一条。游戏聊天框里的对话"被丢在地上"。

**通用做法**：把"在哪说话"抽象成**通道**，而不是给某个游戏写死一条路。

```mermaid
flowchart LR
    subgraph CH["通道（只负责收发，无认知逻辑）"]
        A1["Web 前端"]
        A2["游戏内聊天<br/>minecraft_channel.py"]
        A3["未来：IM 桥 / 语音转写"]
    end
    A1 -->|"POST /api/nlp"| P
    A2 --> HUB["ChannelHub<br/>轮询 2s"]
    A3 --> HUB
    HUB -->|"归一化 → 去重 → 身份判定 → 策略过滤"| P["认知管线<br/>同一个 turn"]
    P -->|"回复文本"| HUB
    HUB -->|"通道.send()"| A2
    P -->|"直接返回"| A1
```

**通道画像（profile）** 承载"这个场合该怎么说话"，不写死在代码里：回复长度上限、是否去 Markdown、轮询间隔、消息最大年龄、是否回复他人、被点名才回答的名单。

**三条硬约束**（模块头）：
1. 不让每个通道各自调 LLM 或各自维护对话状态
2. **不把"别人说的话"当成用户说的话**
3. **不假装配送**：send 失败要如实记录，回复不会"看起来发了"

**身份判定**（`minecraft_channel.py`）：

| sender | 处理 |
|---|---|
| 自己的 bot 名 | `self` → 过滤（否则自己回自己） |
| 用户（默认 Hellucigen） | `user` → 完整认知回合 + 回复 |
| 其他人 | `other` → 默认只观察；**被点名（喊 Haru/哈鲁/Fascinator/fas）才回答** |

通道消息走的是应用自己的 HTTP 入口（`app.test_client().post("/api/nlp", ...)`），**认知逻辑只有一份**。

### 11.2 Minecraft 全栈

```mermaid
flowchart TB

        AUT["autonomy.py<br/>语义意图<br/>observe / approach / follow / explore<br/>/ collect / rest / communicate / withdraw"]
    end

    end
    AUT --> EMB2

    PERC -->|"图节点"| KG2["知识图谱"]
```

**各文件职责**：

| 文件 | 行数 | 职责 |
|---|---|---|
| `minecraft_bridge.py` | 205 | Python 侧 HTTP 桥客户端。`get_state / say / move / call / get_action_result / health / look_at / dig / goto_* / stop_goto / equip / inventory`。**失败策略：桥不可达一律返回 None/False，图谱与对话继续** |
| `bot.js` | 19KB | Node/Mineflayer 侧。HTTP 服务 + 动作端点 + `/action_result` 异步回执 + `/dig` 逐块结果 + 实体相对坐标 |
| `Action/minecraft.py` | 162 | 具体动作面（`follow_player / stop / jump / dig_block / attack / move_forward`）+ `BLOCK_MAP` 中文名→英文名 |
| `minecraft_embodiment.py` | 345 | **具身适配器**：语义意图 → bot 动作。定义了 `CAPABILITIES` 集合与可采集材料**白名单** |
| `minecraft_perception.py` | 127 | **原子感知**：把游戏状态拆成固定身份的动态状态节点（in-place 更新），不是单 blob 节点 |
| `minecraft_reflex.py` | 124 | 游戏内指令解析（纯函数，零 LLM），**第一步判否定** |
| `minecraft_session.py` | 153 | 连接生命周期状态机 |
| `minecraft_channel.py` | 129 | 游戏内聊天作为对话通道 |

**感知节点**（`minecraft_perception.py`）：`Haru的位置 / Haru的血量 / Haru的饥饿 / Haru的手持物 / 附近的玩家 / 附近的方块 / 附近的生物`，落 cognitive 空间，`type=dynamic_state`。

建节点时会接一条 **`Haru -[当前状态]-> 槽位`** 边。注释解释了为什么：

> *"没有这条边时状态节点是孤岛——扩散到不了它、语言层里也没有'这是 Haru 的状态'这个锚点，于是被问'你在哪里'只能靠猜（实测她答成'我在Haru这里，和你一起'）。锚点选 Haru 而不是 Self：Haru 节点出度小，加边几乎不影响 Self 出边的权重归一化。"*

**未知检测**：附近出现的图外玩家/实体 → 建 `UnknownPlayer_N` / `UnknownEntity_N` 节点 + `observed` 边 + 激活 `未知信息`（好奇心信号）。

**连接状态机**：`disconnected → requesting_port → awaiting_port → connecting → connected / failed / cancelled`。**端口必须来自用户明确输入——不猜测、不扫描**。

**MODE0 反射指令**（完全绕过 LLM，`app.py:2690`）：支持 `follow / approach / stop / jump / dig / attack / move`，每类有独立的具名正则。取不到目标就如实拒绝。

两套并行的动作系统，容易混淆：

| 系统 | 位置 | 机制 |
|---|---|---|
| **Action 注册表** | `Action/__init__.py`（146）、`Action/minecraft.py`、`Action/wasd.py` | `discover_actions()` 自动发现 + `get_action_func(name)` 取函数。这是**具身动作面** |
| **Action System** | `actions/action_engine.py`（362） | Phase 4 MVP，**认知层 Capability**：`ActionSelector.evaluate(user_input)` 从图谱状态选能力，产出 Intent 并 `persist_intent` |

另有两个"万物皆图"的动作实现：

- **网络搜索** `actions/web_search.py`（98 行）— `do_web_search(query, top_n=5)`，返回 `[{title, snippet, url}]`
- **文件操作** `actions/file_action.py` — `execute_file_action(action, name, content, dir)`，默认目录"桌面"

### 11.6 程序性节点沙箱

`Node.execution` 字段是 Python 代码字符串，在受限沙箱执行（`app.py` 的 `/api/actions/execute`）。

可访问变量：`graph`、`node`、`result`

可用内置：`print, len, range, min, max, sum, sorted, str, int, float, bool, dict, list, set, tuple, enumerate, zip`

**风险提示**：这是白名单式的沙箱，不是真正的安全边界。当前环境下 `execution` 字段主要由系统自己写入（见 `Action/__init__.py` 编译按键为代码），但 `/api/nodes` 的 POST/PUT 允许外部写入 `execution`，且服务默认只监听本地。若要暴露到公网，这是**必须先加固的点**。

**存盘机制**（`app.py:1298-1401`）：**异步写盘线程**。

```python
_save(force=False)         # 标记脏 + 请求写入（默认节流）
_write_graph_once()        # 真正落盘
_save_writer_loop()        # 后台线程

_flush_save_at_exit()      # atexit 兜底
```

这样 `/api/nlp` 主路径不会因为序列化 651 节点而阻塞。

落盘成功后另走一步**周期快照**（`graph_rotation.maybe_rotate`，2026-09-22，§18.3 P1）：按 `graph_snapshot_interval_s` 时间闸复制当前图谱文件进 `data/graph_snapshots/` 并把旧副本轮转掉（保留 `graph_snapshot_keep` 份）。缩小守卫拦"一次写坏"，快照保证"任意时刻都回得去"；快照失败只记 WARNING，绝不影响主落盘。

## 17. 运行手册

### 17.1 环境要求

- Python 3.10+（本机用 `E:/Miniforge.envs/Fascinator/python.exe`）
- Node.js（Minecraft bot 用，本机在 `E:/Nodejs/node.exe`，不在 PATH）
- BGE 模型：`E:/Models/bge-small-zh-v1.5` 或环境变量 `BGE_MODEL_PATH` 或项目根目录
- LLM：默认走小米 MiMo API，需要 API Key（`data/llm_secret.json` 或 `MIMO_API_KEY`）

### 17.2 安装

```bash
pip install -r requirements.txt
# GPU 版 torch（可选，嵌入编码快 6 倍）
pip install torch --index-url https://download.pytorch.org/whl/cu130
```

### 17.3 初始化（首次）

```bash
python init_jieba_pos.py      # 从 jieba 词典导入实词节点
python seed_speech_acts.py    # 初始化基础设施节点与意图树
```

### 17.4 启动

```bash
python app.py                 # 默认端口 5000，自动打开浏览器
```

环境变量：
- `PORT=8080` — 自定义端口
- `FAS_HOST=0.0.0.0` — 开放到局域网（默认 `127.0.0.1`；服务无鉴权，开放前确认网络可信）
- `FASCINATOR_GRAPH=my_graph.json` — 自定义图谱路径（旧兼容）
- `FAS_NO_BROWSER=1` — 不自动开浏览器
- `HF_HUB_OFFLINE=1` / `TRANSFORMERS_OFFLINE=1` — `app.py` 启动时自动设置（避免 HF 不可达时阻塞）

**启动/停机守卫（2026-09-22 收尾新增，沙盒验收 12/12 通过）**：
- **单实例端口预检**：`app.run` 之前用不带 `SO_REUSEADDR` 的裸 bind 探测目标端口。被占 → 打人话错误（提醒"先确认/停止旧实例，绝不盲杀 python/node 进程——内存态图谱/词表会丢"）并 `SystemExit(2)`。Windows 上 Werkzeug 带 `SO_REUSEADDR` 能"劫持"已监听端口悄悄起第二个大脑，预检堵死这条路。
- **拒启实例零落盘**：预检失败退出时跳过 atexit 图谱保存——否则第二个进程会把"启动瞬间的旧副本"盖回盘上，毁掉在跑实例的增量。
- **浏览器定时器在预检之后**才挂（拒启不白开页面）。
- **优雅停机（Ctrl-C）**：`finally` 依次 `action_manager.cancel("FAS 停机")`（在飞动作如实取消，不假成功）→ `channel_hub.stop()` → `cc.stop()` → MC 桥在线则 `/quit`（不留孤儿 node 进程）→ fas_log `server_stopped`。图谱落盘与 fas_log 收口走既有 atexit。
- **同批修复的 P0**：`app.py` 原把模块级 `import time` 放在 persona 构造之后数百行，而 `_state_clock()` 的回退路径在导入期就调 `time.time()`——任何冷启动必炸 `NameError`（沙盒实测复现）。`import time` 已上移至顶部导入块。

### 17.5 启动时的关键副作用

启动过程会做（`app.py:112-799`）：
1. 合并 Knowledge Pack → Runtime Graph
2. 应用重命名映射、overlay 运行时修改、重建派生索引
3. Bootstrap 认知类型化（Self 节点修复、graph_space 补全、relation_category 补全）
4. **重置所有节点/边的 activation 为 0**（"服务器重启 = 认知重置"）
5. 创建扩散引擎、NLP、Self Model、情景缓冲、持续认知循环、人格基线、反思引擎、LLM 预算、认知调节、Minecraft 桥/会话/自主循环、内部状态、对话通道、驱动力、行动系统、复合短语处理器、Embedding 管理器、Ear/Vision 处理器、能力注册表
6. 播种基础设施节点（社交互动、LLM回答、网络搜索、文件操作、看屏幕、情绪节点、能力节点及其边）
7. 引导焦点事件指针（指向 episodic 空间 timestamp 最新的头部事件）
8. 异步存盘线程启动，持续认知循环线程启动（**Ear/Vision 默认禁用**）

### 17.6 启动 Minecraft 具身

1. 在 Minecraft 里开局域网世界，记下端口
2. 在对话里说"进入 Minecraft 世界，端口 12345"（或前端 Auto 面板）
3. `_ensure_mc_bot()` 会启动 `node bot.js`（等待 20 秒探活）
4. 连接成功后，游戏聊天框里说话即进入认知管线
